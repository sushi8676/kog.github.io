<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>롤 아이템 골드 가치 비교표</title><style>
:root{font:14px/1.5 system-ui,'Malgun Gothic',sans-serif;color-scheme:dark;background:#101722;color:#e7efff}*{box-sizing:border-box}body{margin:0;padding:25px}h1{margin:0;font-size:25px}#patch{color:#a7c5f2;margin:8px 0 18px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,button{background:#1b2a40;color:#e9f2ff;border:1px solid #435876;padding:11px;border-radius:7px}input{min-width:230px}button{cursor:pointer}.info{color:#b3c5d9;font-size:12px;margin:10px 0}.sheet{border:1px solid #334860;border-radius:8px;overflow:auto;max-height:72vh}table{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}th,td{min-width:100px;border-bottom:1px solid #27374e;border-right:1px solid #27374e;padding:10px;text-align:right}thead th{position:sticky;top:0;background:#23364f;z-index:3;padding:0}th:first-child,td:first-child{min-width:195px;position:sticky;left:0;text-align:left;background:#19273c;z-index:4}thead th:first-child{z-index:7;background:#23364f}th:nth-child(2),td:nth-child(2){min-width:130px;position:sticky;left:195px;background:#1b3041;z-index:5}thead th:nth-child(2){z-index:8;background:#254d4b}.hbtn{background:none;color:inherit;border:none;border-radius:0;display:flex;gap:8px;width:100%;justify-content:space-between;font-weight:700;padding:11px;cursor:pointer}.hbtn:hover{background:#354b67}.hbtn span:last-child{opacity:.45}.hbtn.on span:last-child{opacity:1;color:#99caff}.red{background:#3e2730!important;color:#ff838d}.orange{background:#3d3424!important;color:#ffba62}.green{background:#203e35!important;color:#8ce6af}.blue{background:#233b60!important;color:#96c5ff}.muted{color:#91a4ba}.empty{padding:24px;color:#bbc8d9}a{color:#9ec5ff}
</style></head><body><h1>리그 오브 레전드 아이템 · 스탯 비교표</h1><div id="patch">자료 불러오는 중…</div><div class="tools"><input id="q" placeholder="아이템 검색"><select id="kind"><option value="all">모든 아이템</option><option value="시작">시작</option><option value="기본">기본</option><option value="서사">서사</option><option value="전설">전설</option><option value="장화">장화</option></select><select id="type"><option value="all">유형: 전체</option><option value="attack">공격</option><option value="magic">주문</option><option value="defense">방어</option></select><select id="sort"><option value="price:asc">가격 낮은 순</option><option value="price:desc">가격 높은 순</option><option value="name:asc">이름순</option><option value="value:desc">스탯 가치 높은 순</option></select><button id="csv">CSV 저장</button></div><div id="status" class="info"></div><div class="sheet"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><p class="info">스탯 가치 색상은 가격 대비 골드 가치 비율입니다. 모든 능력치에 골드 단가가 정해져 있는 것은 아니므로 고유 효과 및 일부 스탯은 계산에서 제외됩니다. 나무위키에서 확인되지 않은 능력치는 빈칸으로 표시됩니다.</p><p class="info">출처: <a href="https://namu.wiki/w/리그%20오브%20레전드/아이템/시작" target="_blank" rel="noopener">시작</a> · <a href="https://namu.wiki/w/리그%20오브%20레전드/아이템/기본" target="_blank" rel="noopener">기본</a> · <a href="https://namu.wiki/w/리그%20오브%20레전드/아이템/서사" target="_blank" rel="noopener">서사</a> · <a href="https://namu.wiki/w/리그%20오브%20레전드/아이템/전설" target="_blank" rel="noopener">전설</a> · <a href="https://namu.wiki/w/리그%20오브%20레전드/아이템/장화" target="_blank" rel="noopener">장화</a></p>
<script>
const defs=[['name','아이템'],['value','스탯 가치(골드)'],['price','가격'],['ad','공격력'],['ap','주문력'],['armor','방어력'],['mr','마법 저항력'],['as','공격 속도(%)'],['ms','이동 속도'],['hp','체력'],['mana','마나'],['hpregen','체력 재생(%)'],['manaregen','마나 재생(%)'],['ah','스킬 가속'],['crit','치명타 확률(%)'],['critdmg','치명타 피해량(%)'],['lifesteal','생명력 흡수(%)'],['omnivamp','모든 피해 흡혈(%)'],['armorpen','방어구 관통력(%)'],['lethality','물리 관통력'],['magicpen','마법 관통력'],['tenacity','강인함(%)'],['slowres','둔화 저항(%)'],['healshield','회복·보호막 증가(%)']];
const factors={ad:35,ap:20,armor:20,mr:18,as:25,ms:12,hp:400/150,mana:300/250,hpregen:3,manaregen:4,ah:50,crit:40};
let items=[],sort={key:'price',dir:'asc'};
const cell=(r,k)=>k==='name'?r.name:k==='price'?r.price:k==='value'?r.value:r.stats?.[k];
const filtered=()=>{const q=document.querySelector('#q').value.trim().toLocaleLowerCase('ko'),kind=document.querySelector('#kind').value,type=document.querySelector('#type').value;const rows=items.filter(r=>r.name.toLocaleLowerCase('ko').includes(q)&&(kind==='all'||kind===r.kind)&&(type==='all'||(type==='attack'&&['ad','as','crit','armorpen','lethality'].some(k=>r.stats?.[k]>0))||(type==='magic'&&r.stats?.ap>0)||(type==='defense'&&['armor','mr'].some(k=>r.stats?.[k]>0))));rows.sort((a,b)=>{const x=cell(a,sort.key),y=cell(b,sort.key);if(x==null)return y==null?0:1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y,'ko'):x-y)*(sort.dir==='asc'?1:-1)||a.name.localeCompare(b.name,'ko')});return rows};
function render(){const rows=filtered();const body=document.querySelector('#body');body.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const [key] of defs){const td=document.createElement('td'),v=cell(r,key);td.textContent=v==null?'—':typeof v==='number'?v.toLocaleString('ko-KR',{maximumFractionDigits:1}):v;if(key==='value'){td.className=r.value==null?'muted':r.value/r.price<.8?'red':r.value/r.price<1?'orange':r.value/r.price<1.2?'green':'blue'}tr.append(td)}body.append(tr)}document.querySelector('#status').textContent=`${rows.length}개 표시 / 저장된 전체 ${items.length}개`;document.querySelectorAll('.hbtn').forEach(b=>{let active=b.dataset.key===sort.key;b.classList.toggle('on',active);b.lastElementChild.textContent=active&&sort.dir==='desc'?'▲':'▼'})}
for(const [key,label] of defs){const th=document.createElement('th'),b=document.createElement('button');b.type='button';b.className='hbtn';b.dataset.key=key;const t=document.createElement('span'),a=document.createElement('span');t.textContent=label;a.textContent='▼';b.append(t,a);b.onclick=()=>{sort=sort.key===key?{key,dir:sort.dir==='asc'?'desc':'asc'}:{key,dir:'asc'};render()};th.append(b);document.querySelector('#head').append(th)}
for(const id of ['q','kind','type'])document.getElementById(id).addEventListener(id==='q'?'input':'change',render);
document.querySelector('#sort').onchange=e=>{const [key,dir]=e.target.value.split(':');sort={key,dir};render()};
document.querySelector('#csv').onclick=()=>{const rows=[defs.map(x=>x[1]),...filtered().map(r=>defs.map(([k])=>cell(r,k)??''))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='lol_item_stats.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
async function load(){try{const r=await fetch('./data/items.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const raw=await r.json();items=(raw.items||[]).map(x=>{const eligible=Object.entries(x.stats||{}).filter(([k,v])=>factors[k]!=null&&Number.isFinite(v));const value=eligible.length?eligible.reduce((s,[k,v])=>s+v*factors[k],0):null;return {...x,value}});document.querySelector('#patch').textContent=`자료 기준: ${raw.patch||'패치 미지정'} · ${raw.status==='complete'?'전체 확인 자료':'부분 확인 자료 (전체 아이템 검증 미완료)'}`;render()}catch(e){document.querySelector('#patch').textContent='데이터를 불러오지 못했습니다';document.querySelector('#status').textContent=e.message;}}
load();
</script></body></html>
